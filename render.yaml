# Blueprint de referencia: el servicio existente se publica mediante GitHub Actions.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: finanzasmainupgraded
    runtime: node
    region: oregon
    plan: free
    autoDeploy: false  # GitHub Actions solicita un único deploy mediante el hook
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgres
      - key: DB_HOST
        sync: false  # Se configura manualmente en el dashboard
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true  # Render genera un secreto seguro
