# render.yaml — Blueprint de Render para deploy automático
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: finanzas-web
    runtime: node
    region: oregon
    plan: free
    autoDeploy: true
    rootDir: backend
    buildCommand: npm install && cd ../sidan-frontend && npm install && npm run build && cd ../backend && (npm run init-db || echo "DB init pendiente")
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgres
      - key: DB_HOST
        sync: false  # Se configura manualmente en el dashboard
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: finanzas_db
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true  # Render genera un secreto seguro
