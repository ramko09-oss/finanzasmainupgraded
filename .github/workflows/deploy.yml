name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Disparar Despliegue en Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Enviando señal de despliegue a Render..."
            curl -s -f -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "¡Despliegue disparado exitosamente en Render!"
          else
            echo "Nota: RENDER_DEPLOY_HOOK_URL no esta configurado en GitHub Secrets."
            echo "Si conectaste tu cuenta de GitHub directamente en Render, el auto-deploy se gestiona via webhook nativo."
          fi
