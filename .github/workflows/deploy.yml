name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Disparar Despliegue en Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Enviando señal de despliegue a Render..."
            curl --silent --fail --connect-timeout 15 --max-time 60 -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null
            echo "Solicitud aceptada. Confirmar el commit en estado live en Render."
          else
            echo "Error: falta RENDER_DEPLOY_HOOK_URL en GitHub Secrets; no se solicitó despliegue."
            exit 1
          fi
